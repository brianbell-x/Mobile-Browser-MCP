<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Proof Fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Arial, sans-serif; color: #101318; background: #f6f3ec; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 24px 48px; border-bottom: 1px solid #d8d0c1; }
    nav { display: flex; gap: 24px; font-size: 14px; text-transform: uppercase; }
    main { min-height: calc(100vh - 82px); display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center; padding: 48px; }
    h1 { margin: 0; font-size: 80px; line-height: .92; max-width: 780px; }
    p { max-width: 520px; font-size: 20px; line-height: 1.5; }
    .label { display: inline-block; margin-bottom: 20px; padding: 8px 10px; background: #101318; color: white; font-size: 13px; letter-spacing: .08em; }
    .panel { min-height: 420px; display: grid; place-items: center; border: 2px solid #101318; background: #db5836; color: white; font-size: 44px; font-weight: 800; }
    .phone-only { display: none; }
    @media (max-width: 640px) {
      body { background: #101318; color: #fffaf1; padding-bottom: 74px; }
      header { padding: 16px 18px; }
      nav { position: fixed; inset: auto 12px 12px; justify-content: space-around; padding: 14px; background: #fffaf1; color: #101318; border-radius: 18px; z-index: 2; }
      main { min-height: auto; display: flex; flex-direction: column; gap: 24px; padding: 24px 18px; }
      h1 { font-size: 44px; line-height: 1; }
      p { font-size: 17px; }
      .desktop-only { display: none; }
      .phone-only { display: inline-block; }
      .panel { width: 100%; min-height: 230px; border-color: #fffaf1; background: #2c7a73; font-size: 30px; border-radius: 22px; }
    }
  </style>
</head>
<body>
  <header>
    <strong>Viewport Lab</strong>
    <nav><span>Audit</span><span>Layout</span><span>Proof</span></nav>
  </header>
  <main>
    <section>
      <span class="label desktop-only">DESKTOP LAYOUT</span>
      <span class="label phone-only">PHONE LAYOUT</span>
      <h1>One app, two real render paths.</h1>
      <p>This page deliberately changes structure, colors, navigation placement, and content labels at a phone breakpoint.</p>
    </section>
    <section class="panel">
      <span class="desktop-only">WIDE GRID</span>
      <span class="phone-only">STACKED PHONE</span>
    </section>
  </main>
</body>
</html>
